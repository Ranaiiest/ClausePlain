[browser]
gatherUsageStats = false

[server]
headless = true
# Streamlit's source watcher walks `transformers` and lazy-imports hundreds of
# vision processors (`torchvision`). This app only uses text embeddings — disable
# watching so those ModuleNotFoundError dumps do not flood the terminal.
fileWatcherType = "none"
folderWatchBlacklist = [
    ".venv",
    "**/site-packages",
    "data",
    "logs",
]

# Force light theme so Streamlit does not paint white text on our cream paper.
[theme]
base = "light"
primaryColor = "#c45c26"
backgroundColor = "#f6f1e8"
secondaryBackgroundColor = "#fffcf7"
textColor = "#1b2430"
font = "sans serif"
